<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel</title>
    <script>
        function verifyPassword() {
            const password = document.getElementById('password').value;
            // Replace 'your_password' with the desired password
            if (password === 'your_password') {
                document.getElementById('adminPanel').style.display = 'block';
                document.getElementById('loginForm').style.display = 'none';
            } else {
                alert('Incorrect password!');
            }
        }

        function saveData() {
            const data = document.getElementById('dataInput').value;
            // Here you would add functionality to save the data to data.json
            console.log(data); // Replace this with actual saving mechanism
            alert('Data saved!');
        }
    </script>
</head>
<body>
    <h1>Admin Panel</h1>
    <div id="loginForm">
        <label for="password">Password:</label>
        <input type="password" id="password">
        <button onclick="verifyPassword()">Login</button>
    </div>
    <div id="adminPanel" style="display:none;">
        <h2>Edit Data</h2>
        <textarea id="dataInput" rows="10" cols="30"></textarea><br>
        <button onclick="saveData()">Save</button>
    </div>
</body>
</html>
