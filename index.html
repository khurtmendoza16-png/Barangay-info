<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Barangay Info</title>
<style>
body {
  font-family: 'Segoe UI', Arial, sans-serif;
  background: #e0f2f1;
  margin: 0;
  padding: 0;
  color: #333;
}
header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: linear-gradient(90deg, #2E8B57, #3CB371);
  color: white;
  padding: 20px 30px;
}
header h1 { margin: 0; font-size: 2em; }
#adminButton {
  background: #fff;
  color: #2E8B57;
  padding: 8px 15px;
  border: none;
  border-radius: 8px;
  font-weight: bold;
  cursor: pointer;
  transition: 0.3s;
}
#adminButton:hover { background: #f1f1f1; }

/* Navigation buttons */
.nav-buttons {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin: 20px auto;
  justify-content: center;
}
.nav-buttons button {
  background: #2E8B57;
  color: white;
  border: none;
  padding: 12px 20px;
  border-radius: 12px;
  cursor: pointer;
  font-weight: 600;
  transition: 0.3s;
}
.nav-buttons button:hover {
  background: #3CB371;
  transform: translateY(-2px);
}

/* Public sections */
.section {
  display: none;
  width: 90%;
  max-width: 1000px;
  margin: 20px auto;
  padding: 30px;
  background: linear-gradient(120deg, #ffffff, #f0fff5);
  border-radius: 12px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.05);
  opacity: 0;
  transform: translateY(20px);
  transition: opacity 0.5s ease, transform 0.5s ease;
}
.section.show {
  display: block;
  opacity: 1;
  transform: translateY(0);
}
.section h2 {
  color: #2E8B57;
  margin-top: 0;
  font-size: 1.8em;
  border-bottom: 2px solid #2E8B57;
  padding-bottom: 5px;
}
.section ul { padding-left: 25px; font-size: 1.1em; }
.section li { margin-bottom: 8px; line-height: 1.5; }
.section p { font-size: 1.1em; line-height: 1.6; }
.close-btn {
  position: absolute;
  top: 15px; right: 15px;
  background-color: #c0392b;
  color: white;
  border: none;
  padding: 8px 14px;
  border-radius: 8px;
  cursor: pointer;
  font-size: .9em;
  transition: 0.3s;
}
.close-btn:hover { background-color: #e74c3c; }

/* Admin Login */
.login-box {
  max-width: 350px;
  background: white;
  padding: 25px 20px;
  border-radius: 15px;
  box-shadow: 0 5px 20px rgba(0,0,0,0.25);
  text-align: center;
  display: none;
  position: fixed;
  top: 100px;
  right: 20px;
  z-index: 10;
}
.login-box input[type="password"] {
  padding: 10px;
  width: 90%;
  border-radius: 8px;
  border: 1px solid #ccc;
  margin-bottom: 15px;
  font-size: 1em;
}
.login-box button {
  padding: 10px 20px;
  border: none;
  border-radius: 10px;
  background: #2E8B57;
  color: white;
  font-size: 1em;
  cursor: pointer;
  margin: 5px;
}
.login-box button:hover { background: #3CB371; }
.show-password { margin-bottom: 15px; cursor: pointer; font-size: 0.9em; color: #555; }
#error { color: red; font-size: 0.9em; margin-top: 10px; min-height: 18px; }

/* Admin sections */
.admin-section {
  display: flex;
  flex-direction: column;
  background: #f0fff5;
  padding: 20px;
  margin: 20px auto;
  border-radius: 12px;
  max-width: 800px;
}
.admin-section .preview {
  background: white;
  padding: 15px;
  border: 1px solid #2E8B57;
  border-radius: 10px;
  margin-bottom: 15px;
  min-height: 40px;
}
.admin-section [contenteditable="true"] {
  outline: 1px dashed #2E8B57;
  padding: 6px 8px;
  border-radius: 6px;
  margin-bottom: 5px;
}

/* Footer */
footer { text-align:center; margin:30px 0; font-size:.9em; color:#555; }

</style>
</head>
<body>

<header>
  <h1>Barangay Info</h1>
  <button id="adminButton" onclick="showLogin()">Admin Login</button>
</header>

<div class="nav-buttons" id="navButtons"></div>
<div id="sectionsContainer"></div>

<!-- Admin Login -->
<div class="login-box" id="loginBox">
  <input type="password" id="password" placeholder="Enter admin password">
  <div>
    <input type="checkbox" id="showPass"> <label for="showPass" class="show-password">Show Password</label>
  </div>
  <button onclick="checkPassword()">Login</button>
  <button onclick="exitLogin()">Exit</button>
  <p id="error"></p>
</div>

<footer>&copy; 2026 Barangay Info System</footer>

<script>
const adminButton = document.getElementById('adminButton');
const loginBox = document.getElementById('loginBox');
const passwordInput = document.getElementById('password');
const errorMsg = document.getElementById('error');
const navButtons = document.getElementById('navButtons');
const sectionsContainer = document.getElementById('sectionsContainer');

let globalData = {};
let adminMode = false;

function showLogin(){ loginBox.style.display='block'; }
function exitLogin(){ loginBox.style.display='none'; passwordInput.value=''; errorMsg.innerText=''; }

document.getElementById('showPass').addEventListener('change', function(){
  passwordInput.type = this.checked ? 'text' : 'password';
});

passwordInput.addEventListener('input', ()=>{ if(errorMsg.innerText) errorMsg.innerText=''; });

async function loadData(){
  const response = await fetch('data.json');
  const data = await response.json();
  globalData = data;

  navButtons.innerHTML = '';
  sectionsContainer.innerHTML = '';

  for(const key in data){
    let title = key.replace(/_/g,' ').replace(/\b\w/g,l=>l.toUpperCase());

    // Navigation buttons
    const navBtn = document.createElement('button');
    navBtn.innerText = title;
    navBtn.onclick = ()=>showSection(key);
    navButtons.appendChild(navBtn);

    // Section
    const sec = document.createElement('div'); 
    sec.id = key; 
    sec.className = adminMode ? 'admin-section' : 'section';
    const h2 = document.createElement('h2'); h2.innerText = title; 
    sec.appendChild(h2);

    const content = data[key];

    if(adminMode){
        const preview = document.createElement('div'); 
        preview.className='preview'; 
        preview.id=key+'-preview'; 
        sec.appendChild(preview);
    }

    if(Array.isArray(content)){
        content.forEach((item,i)=>{
            const li=document.createElement('li'); li.innerText=item;
            if(adminMode){ li.contentEditable=true; li.dataset.arrayKey=key; li.dataset.index=i; li.addEventListener('input',()=>updatePreview(key)); }
            sec.appendChild(li);
        });
    } else if(typeof content==='object'){
        for(const sub in content){
            const p=document.createElement('p'); p.innerText=`${sub}: ${content[sub]}`;
            if(adminMode){ p.contentEditable=true; p.dataset.objKey=key; p.dataset.subKey=sub; p.addEventListener('input',()=>updatePreview(key)); }
            sec.appendChild(p);
        }
    } else {
        const p=document.createElement('p'); p.innerText = content;
        if(adminMode){ p.dataset.key=key; p.contentEditable=true; p.addEventListener('input',()=>updatePreview(key)); }
        sec.appendChild(p);
    }

    if(adminMode){
        const saveBtn = document.createElement('button'); saveBtn.className='save-btn'; saveBtn.innerText='Download JSON';
        saveBtn.onclick=saveData; sec.appendChild(saveBtn);
        const closeBtn = document.createElement('button'); closeBtn.className='close-btn'; closeBtn.innerText='Close';
        closeBtn.onclick=closeSection; sec.appendChild(closeBtn);
    }

    sectionsContainer.appendChild(sec);
  }

  if(!adminMode) document.querySelectorAll('.section').forEach(sec=>sec.style.display='none');
}

function showSection(id){
  document.querySelectorAll('.section, .admin-section').forEach(sec=>sec.style.display='none');
  const sec = document.getElementById(id);
  sec.classList.add('show');
}

function closeSection(){ document.querySelectorAll('.section, .admin-section').forEach(sec=>sec.style.display='none'); }

function updatePreview(id){
  const preview=document.getElementById(id+'-preview');
  let text='';
  document.querySelectorAll(`#${id} [contenteditable="true"]`).forEach(el=>{
    text+=el.innerText+'\n';
  });
  preview.innerText=text.trim();
}

function saveData(){
  document.querySelectorAll('[contenteditable="true"]').forEach(el=>{
    if(el.dataset.arrayKey) globalData[el.dataset.arrayKey][el.dataset.index]=el.innerText;
    else if(el.dataset.objKey){
      const parts=el.innerText.split(':'); if(parts.length>1) globalData[el.dataset.objKey][el.dataset.subKey]=parts.slice(1).join(':').trim();
    }
    else if(el.dataset.key) globalData[el.dataset.key]=el.innerText;
  });

  const blob=new Blob([JSON.stringify(globalData,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download='data.json'; a.click();
  URL.revokeObjectURL(url);
}

function checkPassword(){
  const pass = passwordInput.value.trim();
  if(pass === "barangay123"){
    loginBox.style.display='none';
    adminMode = true;
    loadData();
  } else {
    errorMsg.innerText = "Incorrect password. Please try again.";
    passwordInput.value = "";
    passwordInput.focus();
  }
}

loadData();
</script>
</body>
</html>
