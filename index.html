<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Barangay Info</title>
<style>
  body { font-family: Arial, sans-serif; background:#f0f4f7; margin:0; padding:20px; color:#333; }
  header { text-align:center; padding:25px; background:linear-gradient(90deg,#2E8B57,#3CB371); color:white; border-radius:12px; box-shadow:0 4px 8px rgba(0,0,0,0.1); margin-bottom:25px;}
  header h1 { margin:0; } header p { margin:5px 0 0 0; }
  .button-container { display:flex; flex-wrap:wrap; justify-content:center; gap:15px; margin-bottom:25px; }
  .btn { background-color:#2E8B57; color:white; border:none; padding:15px 25px; border-radius:10px; font-size:1em; cursor:pointer; box-shadow:0 2px 5px rgba(0,0,0,0.2); transition:.3s; }
  .btn:hover { background-color:#3CB371; }
  .section { display:none; background:white; padding:20px; margin-bottom:20px; border-radius:12px; box-shadow:0 3px 6px rgba(0,0,0,0.1); position:relative;}
  h2 { color:#2E8B57; margin-top:0; border-bottom:2px solid #2E8B57; padding-bottom:5px; }
  ul { padding-left:25px; line-height:1.6; }
  .close-btn { position:absolute; top:15px; right:15px; background-color:#c0392b; color:white; border:none; padding:8px 12px; border-radius:8px; cursor:pointer; font-size:.9em; transition:.3s; }
  .close-btn:hover { background-color:#e74c3c; }
  footer { text-align:center; margin-top:30px; font-size:.9em; color:#555; }
</style>
</head>
<body>

<header>
  <h1>Barangay Info System</h1>
  <p>Click a button to view details</p>
</header>

<div class="button-container" id="buttons"></div>
<div id="sections-container"></div>

<footer>&copy; 2026 Barangay Info System</footer>

<script>
async function loadData() {
  const response = await fetch('data.json'); // Load JSON
  const data = await response.json();

  const buttonsDiv = document.getElementById('buttons');
  const sectionsDiv = document.getElementById('sections-container');

  // Clear containers
  buttonsDiv.innerHTML = '';
  sectionsDiv.innerHTML = '';

  // For each section in JSON
  for (const key in data) {
    let title = key.replace(/_/g,' ').replace(/\b\w/g,l => l.toUpperCase()); // e.g. office_hours → Office Hours
    // Create button
    const btn = document.createElement('button');
    btn.className = 'btn';
    btn.innerText = title;
    btn.onclick = () => showSection(key);
    buttonsDiv.appendChild(btn);

    // Create section
    const sec = document.createElement('div');
    sec.id = key;
    sec.className = 'section';

    // Close button
    const closeBtn = document.createElement('button');
    closeBtn.className = 'close-btn';
    closeBtn.innerText = 'Close';
    closeBtn.onclick = closeSection;
    sec.appendChild(closeBtn);

    // Section content
    const h2 = document.createElement('h2');
    h2.innerText = title;
    sec.appendChild(h2);

    // Add content
    const content = data[key];
    if(Array.isArray(content)) {
      const ul = document.createElement('ul');
      content.forEach(item => {
        const li = document.createElement('li');
        li.innerText = item;
        ul.appendChild(li);
      });
      sec.appendChild(ul);
    } else if(typeof content === 'object') {
      for(const sub in content){
        const p = document.createElement('p');
        p.innerText = `${sub.charAt(0).toUpperCase() + sub.slice(1)}: ${content[sub]}`;
        sec.appendChild(p);
      }
    } else {
      const p = document.createElement('p');
      p.innerText = content;
      sec.appendChild(p);
    }

    sectionsDiv.appendChild(sec);
  }
}

function showSection(id){
  document.getElementById('buttons').style.display = 'none';
  document.querySelectorAll('.section').forEach(sec => sec.style.display='none');
  document.getElementById(id).style.display = 'block';
}

function closeSection(){
  document.querySelectorAll('.section').forEach(sec => sec.style.display='none');
  document.getElementById('buttons').style.display = 'flex';
  window.scrollTo({top:0,behavior:'smooth'});
}

loadData();
</script>

</body>
</html>
