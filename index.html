<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Barangay Info</title>
<style>
body { font-family:'Segoe UI', Arial; background:#f0f4f9; margin:0; padding:0 20px; color:#333;}
header { display:flex; justify-content:space-between; align-items:center; background:linear-gradient(90deg,#2E8B57,#3CB371); color:white; padding:20px; border-radius:0 0 15px 15px; box-shadow:0 4px 10px rgba(0,0,0,0.15);}
header h1{margin:0;font-size:1.8em;} 
#adminButton{background:#fff;color:#2E8B57;padding:8px 15px;border:none;border-radius:8px;font-weight:bold;cursor:pointer;transition:0.3s;}
#adminButton:hover{background:#f1f1f1;}
.nav-buttons{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0;justify-content:center;}
.nav-buttons button{background:#2E8B57;color:white;border:none;padding:10px 18px;border-radius:10px;cursor:pointer;transition:0.3s;}
.nav-buttons button:hover{background:#3CB371;}
.section{display:none;background:white;padding:25px 20px;margin-bottom:25px;border-radius:15px;box-shadow:0 5px 15px rgba(0,0,0,0.1);position:relative;}
.section h2{color:#2E8B57;margin-top:0;border-bottom:2px solid #2E8B57;padding-bottom:5px;}
[contenteditable="true"]{background:#f0fff5;padding:6px 8px;border-radius:6px;min-height:18px;margin:5px 0;outline:1px dashed #2E8B57;}
.close-btn{position:absolute;top:15px;right:15px;background-color:#c0392b;color:white;border:none;padding:8px 14px;border-radius:8px;cursor:pointer;font-size:.9em;transition:0.3s;}
.close-btn:hover{background-color:#e74c3c;transform:translateY(-2px);}
.save-btn{background:#2980b9;color:white;border:none;padding:12px 20px;border-radius:10px;cursor:pointer;font-size:1em;margin-top:15px;box-shadow:0 3px 8px rgba(0,0,0,0.2);transition:0.3s;}
.save-btn:hover{background:#3498db;transform:translateY(-2px);}
.login-box { max-width:300px; margin:20px auto; background:white; padding:25px 20px; border-radius:15px; box-shadow:0 5px 15px rgba(0,0,0,0.2); text-align:center; display:none; position:fixed; top:100px; right:20px; z-index:10;}
.login-box input[type="password"]{padding:10px; width:90%; border-radius:8px; border:1px solid #ccc; margin-bottom:15px; font-size:1em;}
.login-box button { padding:10px 20px; border:none; border-radius:10px; background:#2E8B57; color:white; font-size:1em; cursor:pointer; transition:0.3s;}
.login-box button:hover{background:#3CB371;}
.show-password{margin-bottom:15px; cursor:pointer; font-size:0.9em; color:#555;}
#error{color:red; font-size:0.9em; margin-top:10px; min-height:18px;}
.preview{background:#f0fff5;border:1px solid #2E8B57;border-radius:10px;padding:10px;margin-top:10px;min-height:20px;}
footer{text-align:center;margin:30px 0;font-size:.9em;color:#555;}
</style>
</head>
<body>

<header>
<h1>Barangay Info</h1>
<button id="adminButton" onclick="showLogin()">Admin Login</button>
</header>

<!-- Public Navigation -->
<div class="nav-buttons" id="navButtons"></div>

<!-- Public Sections -->
<div id="sectionsContainer"></div>

<!-- Admin Login -->
<div class="login-box" id="loginBox">
  <input type="password" id="password" placeholder="Enter admin password">
  <div>
    <input type="checkbox" id="showPass"> <label for="showPass" class="show-password">Show Password</label>
  </div>
  <button onclick="checkPassword()">Login</button>
  <p id="error"></p>
</div>

<footer>&copy; 2026 Barangay Info System</footer>

<script>
const adminButton = document.getElementById('adminButton');
const loginBox = document.getElementById('loginBox');
const passwordInput = document.getElementById('password');
const errorMsg = document.getElementById('error');
const navButtons = document.getElementById('navButtons');
const sectionsContainer = document.getElementById('sectionsContainer');

let globalData = {};
let adminMode = false;

function showLogin(){ loginBox.style.display='block'; }

document.getElementById('showPass').addEventListener('change', function(){
  passwordInput.type = this.checked ? 'text' : 'password';
});

passwordInput.addEventListener('input', ()=>{ if(errorMsg.innerText) errorMsg.innerText=''; });

async function loadData(){
  const response = await fetch('data.json');
  const data = await response.json();
  globalData = data;

  navButtons.innerHTML = '';
  sectionsContainer.innerHTML = '';

  for(const key in data){
    let title = key.replace(/_/g,' ').replace(/\b\w/g,l=>l.toUpperCase());

    // Navigation buttons
    const navBtn = document.createElement('button');
    navBtn.innerText = title;
    navBtn.onclick = ()=>showSection(key);
    navButtons.appendChild(navBtn);

    // Section
    const sec = document.createElement('div'); sec.id = key; sec.className = 'section';
    const h2 = document.createElement('h2'); h2.innerText = title; sec.appendChild(h2);
    const preview = document.createElement('div'); preview.className='preview'; preview.id=key+'-preview'; sec.appendChild(preview);

    const content = data[key];
    if(Array.isArray(content)){
      content.forEach((item,i)=>{
        const li=document.createElement('li'); li.innerText=item;
        if(adminMode){ li.contentEditable=true; li.dataset.arrayKey=key; li.dataset.index=i; li.addEventListener('input',()=>updatePreview(key)); }
        sec.appendChild(li);
      });
    } else if(typeof content==='object'){
      for(const sub in content){
        const p=document.createElement('p'); p.innerText=`${sub}: ${content[sub]}`;
        if(adminMode){ p.contentEditable=true; p.dataset.objKey=key; p.dataset.subKey=sub; p.addEventListener('input',()=>updatePreview(key)); }
        sec.appendChild(p);
      }
    } else {
      const p=document.createElement('p'); p.innerText = content;
      if(adminMode){ p.contentEditable=true; p.dataset.key=key; p.addEventListener('input',()=>updatePreview(key)); }
      sec.appendChild(p);
    }

    // Admin-only save and close buttons
    if(adminMode){
      const closeBtn = document.createElement('button'); closeBtn.className='close-btn'; closeBtn.innerText='Close';
      closeBtn.onclick=closeSection; sec.appendChild(closeBtn);
      const saveBtn = document.createElement('button'); saveBtn.className='save-btn'; saveBtn.innerText='Download JSON';
      saveBtn.onclick=saveData; sec.appendChild(saveBtn);
    }

    sectionsContainer.appendChild(sec);
  }
  if(!adminMode) document.querySelectorAll('.section').forEach(sec=>sec.style.display='none');
}
function showSection(id){
  document.querySelectorAll('.section').forEach(sec=>sec.style.display='none');
  document.getElementById(id).style.display='block';
  if(adminMode) updatePreview(id);
}
function closeSection(){ document.querySelectorAll('.section').forEach(sec=>sec.style.display='none'); }
function updatePreview(id){
  const preview=document.getElementById(id+'-preview');
  let text='';
  document.querySelectorAll(`#${id} [contenteditable="true"]`).forEach(el=>{
    text+=el.innerText+'\n';
  });
  preview.innerText=text.trim();
}
function saveData(){
  document.querySelectorAll('[contenteditable="true"]').forEach(el=>{
    if(el.dataset.arrayKey) globalData[el.dataset.arrayKey][el.dataset.index]=el.innerText;
    else if(el.dataset.objKey){
      const parts=el.innerText.split(':'); if(parts.length>1) globalData[el.dataset.objKey][el.dataset.subKey]=parts.slice(1).join(':').trim();
    }
    else if(el.dataset.key) globalData[el.dataset.key]=el.innerText;
  });

  const blob=new Blob([JSON.stringify(globalData,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download='data.json'; a.click();
  URL.revokeObjectURL(url);
}

function checkPassword(){
  const pass = passwordInput.value.trim();
  if(pass === "barangay123"){
    loginBox.style.display='none';
    adminMode = true;
    loadData(); // reload page in admin mode
  } else {
    errorMsg.innerText = "Incorrect password. Please try again.";
    passwordInput.value = "";
    passwordInput.focus();
  }
}

// Load public data by default
loadData();
</script>

</body>
</html>
